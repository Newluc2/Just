server {
    listen 8080;
    server_name just.newluc.top;
    
    access_log /var/log/nginx/just.newluc.top.access_log combined_lolo;
    error_log /var/log/nginx/just.newluc.top.error_log;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    http3 on;
    server_name just.newluc.top;
    
    access_log /var/log/nginx/just.newluc.top.access_log combined_lolo;
    error_log /var/log/nginx/just.newluc.top.error_log;

    root /mnt/glusterfs/wwwroot/letsencrypt.lolomin.net;

    ssl_certificate /etc/letsencrypt/live/newluc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newluc.top/privkey.pem;

    # SSL Proxy settings
    proxy_ssl_verify off;
    proxy_ssl_server_name off;
    
    # Headers
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # Taille max des uploads (fichiers, avatars)
    client_max_body_size 50M;

    location /.well-known {
        alias /var/www/html/just.newluc.top/.well-known;
        try_files $uri $uri/ =404;
    }

    location / {
#       include /etc/nginx/conf.d/lolo_include;
        #deny all;

        proxy_pass http://192.168.0.142:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts pour WebSocket et uploads
        proxy_read_timeout 86400s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}